<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUNGAT PLAY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-container">
        <h2>YUNGAT PLAY</h2>
        <div class="coin-box">
            🪙 <span id="coin-balance">1000</span>
        </div>
    </header>

    <main class="main-content">
        <h3>Your World of Games</h3>
        <p>Choose a game and start playing</p>

        <div class="game-grid">
            <div class="game-card">
                <div class="game-icon">🎯</div>
                <h4>Tic-Tac-Toe</h4>
                <button class="play-btn">PLAY</button>
            </div>
            <div class="game-card">
                <div class="game-icon">🎲</div>
                <h4>Ludo</h4>
                <button class="play-btn">PLAY</button>
            </div>
            <div class="game-card">
                <div class="game-icon">🃏</div>
                <h4>Card Match</h4>
                <button class="play-btn">PLAY</button>
            </div>
            <div class="game-card">
                <div class="game-icon">🫧</div>
                <h4>Bubble Shooter</h4>
                <button class="play-btn">PLAY</button>
            </div>
            <div class="game-card">
                <div class="game-icon">🏃</div>
                <h4>Runner</h4>
                <button class="play-btn">PLAY</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
